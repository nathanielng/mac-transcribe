[project]
name = "mac-transcribe-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mlx-whisper>=0.4.0",
    "anthropic[bedrock]>=0.40.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
cjk = ["mlx-audio>=0.1.0"]
mlx_lm = ["mlx-lm>=0.19.0"]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
